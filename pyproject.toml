[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagegen"
version = "0.1.0"
description = "Generate printable pages and KDP books: word searches, moon calendars, tarot spreads"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "better-profanity>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pagegen = "pagegen.cli:main"
wordsearch = "pagegen.wordsearch.cli:main"

[tool.setuptools]
packages = ["pagegen", "pagegen.wordsearch", "pagegen.moon", "pagegen.tarot"]

[tool.setuptools.package-data]
pagegen = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]
